[project]
name = "scamguard-backend"
version = "0.1.0"
description = "ScamGuard AI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "Pillow>=10.4,<13.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]
ocr = [
    "paddleocr>=3.0,<4.0",
    "paddlepaddle>=3.0,<4.0",
]
browser = [
    "playwright>=1.50,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
